[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "script-rule-mining"
version = "0.1.0"
description = "Association Rule Mining for MIBI-TOF Data"
requires-python = ">=3.10"
dependencies = [
    "spatial-association-rules",
    "ipython",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "seaborn",
    "statsmodels",
    "plotly",
    "nbformat"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
# The mining lives in the spatial-association-rules package now. Installing this
# project only puts these two modules on the path, so the notebooks can import them.
packages = []
py-modules = ["constants", "run_association_mining"]
