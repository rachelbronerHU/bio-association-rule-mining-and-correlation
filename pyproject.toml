[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "script-rule-mining"
version = "0.1.0"
description = "Association Rule Mining for MIBI-TOF Data"
readme = "fpgrowth_rule_mining/README.md"
requires-python = ">=3.10"
dependencies = [
    "ipython",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "seaborn",
    "statsmodels",
    "plotly",
    "nbformat"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
# The library only. data_exploration and result_exploration are this project's own
# scripts and notebooks, not something an install should ship.
packages = ["fpgrowth_rule_mining", "fpgrowth_rule_mining.validation"]
py-modules = ["constants", "run_association_mining"]
